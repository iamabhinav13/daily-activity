name: auto-commit

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  commit-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run script
        run: python update.py

      - name: Commit changes
        run: |
          git config --global user.name "iamabhinav13"
          git config --global user.email "saxenaabhinav567@gmail.com"
          git add .
          git commit -m "update log" || exit 0
          git push
